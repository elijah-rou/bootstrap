name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install test tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck zsh
      - name: Install test tools on macOS
        if: runner.os == 'macOS'
        run: |
          brew list shellcheck || brew install shellcheck
          brew list coreutils || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - run: ./scripts/validate

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck zsh
      - name: Install isolated pinned runtime dependencies
        run: |
          source ./install.sh
          export BUN_INSTALL="$RUNNER_TEMP/bootstrap-test-bun"
          bun install --global --ignore-scripts \
            "$PI_CLI_PACKAGE@$PI_CLI_VERSION" pi-web-access@0.24.2 @openai/codex@0.153.4
          runtime="$BUN_INSTALL/install/global/node_modules"
          subagents="$RUNNER_TEMP/bootstrap-test-subagents"
          read -r _ repository revision <<< "$(read_pi_subagents_package pi/settings.json)"
          git init "$subagents"
          git -C "$subagents" remote add origin "https://$repository.git"
          git -C "$subagents" fetch --depth=1 origin "$revision"
          git -C "$subagents" checkout --detach FETCH_HEAD
          bun install --ignore-scripts --cwd "$subagents"
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
          {
            echo "PI_BASH_OPERATIONS_TEST_RUNTIME_PATH=$runtime/@earendil-works/pi-coding-agent/dist/core/tools/bash.js"
            echo "PI_SKILLS_TEST_RUNTIME_PATH=$runtime/@earendil-works/pi-coding-agent/dist/core/skills.js"
            echo "PI_FAST_RUNTIME_SOURCE=$runtime/@earendil-works/pi-coding-agent"
            echo "PI_WEB_ACCESS_SSRF_MODULE=$runtime/pi-web-access/ssrf-protection.ts"
            echo "PI_SUBAGENTS_TEST_RUNTIME_SOURCE=$subagents"
          } >> "$GITHUB_ENV"
      - name: Validate installed Pi and Codex consumers without authentication
        run: ./scripts/validate --runtime
