name: Validate
on:
  # Every pushed branch is verified before it is promoted to main.
  push:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck zsh
      - run: scripts/validate

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:24.04', account: user, args: '' }
          - { image: 'ubuntu:24.04', account: root, args: '--languages rust go python typescript zig c --lsp rust-analyzer gopls basedpyright ruff typescript-language-server bash-language-server zls clangd --tools zsh tmux starship just shellcheck codex pi claude herdr' }
          - { image: 'debian:13', account: user, args: '--tools pi claude herdr' }
          - { image: 'fedora:42', account: root, args: '--languages c --tools zsh tmux' }
          - { image: 'archlinux:latest', account: root, args: '--languages c --tools zsh tmux' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: tests/container.sh '${{ matrix.image }}' '${{ matrix.account }}' ${{ matrix.args }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Round-trip in a disposable HOME
        run: |
          mkdir "$RUNNER_TEMP/home"
          env -i HOME="$RUNNER_TEMP/home" USER="$USER" TERM=xterm \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin \
            /bin/bash tests/roundtrip.sh "$PWD" --languages go --lsp gopls --tools pi claude herdr
