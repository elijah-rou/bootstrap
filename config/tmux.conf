# Extended keys for Pi/modern terminal apps.
# Force mode 1 so modified keys like Shift+Enter stay distinct even when apps
# don't request modifyOtherKeys themselves.
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'
set -g default-terminal "tmux-256color"

# Reduce terminal latency and notify apps/editors when focus changes.
set -sg escape-time 0
set -g focus-events on

# Large scrollback buffer (default is 2000)
set -g history-limit 50000

# Enable mouse support (scrolling)
set -g mouse on

# Pass window titles to terminal (Moshi displays these)
set -g set-titles on
# Now it shows 1: Fixing auth... (your window title in tmux)
set -g set-titles-string "#I: #T"

# Start window numbering at 1 (Moshi displays from 1)
set -g base-index 1
setw -g pane-base-index 1

unbind &
unbind x
unbind X

bind & kill-pane
bind x kill-window
bind X kill-window
bind k confirm-before -p "kill current session #S? (y/n)" kill-session

# Open new panes/windows in the current pane's path.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style copy mode with cross-platform clipboard copy.
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; else cat >/dev/null; fi'"

# Reload config quickly.
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Status bar
set -g status-interval 5
set -g status-left-length 30
set -g status-left " #S || "
set -g status-right ""
set -g window-status-format "#I:#W | "
set -g window-status-current-format "#I:#W*| "
set -g status-justify left
